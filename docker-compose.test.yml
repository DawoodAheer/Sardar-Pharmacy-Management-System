# Isolated persistence test. No host ports, production names or production volumes.
services:
  mongodb:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [capacity_test_data:/data/db]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval \"try { quit(rs.status().myState === 1 ? 0 : 1); } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(1); }\""]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    build: ./server
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/pharmadesk_docker_test?replicaSet=rs0
      JWT_ACCESS_SECRET: isolated-docker-test-access-secret
      JWT_REFRESH_SECRET: isolated-docker-test-refresh-secret
      PHARMADESK_BACKUP_DIR: /app/backups
      PHARMADESK_BACKUP_SHARE_DIR: /app/share
    volumes: [capacity_test_backups:/app/backups, capacity_test_share:/app/share]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "node -e \"require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build: ./client
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  capacity_test_data:
  capacity_test_backups:
  capacity_test_share:
